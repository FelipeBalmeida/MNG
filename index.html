<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TibiaMNG - Em Manutenção</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #05080f;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('/assets/banner4.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.4);
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #334155;
            border-radius: 8px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #fbbf24;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .status {
            display: inline-block;
            background-color: #d97706;
            color: #000000;
            font-weight: bold;
            font-size: 12px;
            padding: 8px 16px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>

    <div class="content">
        <h1>TIBIA MANAGER</h1>
        <p>Estamos realizando melhorias na infraestrutura e atualizações no sistema para lhe oferecer uma experiência ainda melhor. Retornaremos em breve.</p>
        <div class="status">Em Manutenção</div>
    </div>

</body>
</html>
